<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- name attribute -->
    <form action="/server>">
         <div>
            <label for="username">Username : </label>
            <input type="text"
             placeholder="enter username" 
             id="username" 
             name="user"
             />
        </div>
        <div>
            <label for="password">Password : </label>
            <input type="password" 
            placeholder="enter password" 
            id="password" 
            name="pass"
            />
        </div>
        <button>submit</button>
    </form>
    <hr>
    <br>

    
    <!--using link directly to give result in form-->
    <form action="https://www.youtube.com/results">
        <input type="text" placeholder="search in youtube" name="search_query">
        <button>search</button>
    </form>


    <hr>
    <!-- checkbox in input element-->
    <form action="/server">
        <input type="checkbox" id="age" name="age">
        <label for="age" > I am 18+ </label>
        <br>
        <input type="checkbox" id="grades" name="grades" checked>
        <label for="grades>"> I got A+ in all subjects</label>
    </form>
    <hr>

    <!--radio button-->
    <form action="/server">
        <input type="radio" name="fruit" id="apple" value="apple">
        <label for="apple">Apple</label>
        <input type="radio" name="fruit" id="mango" value="mango">
        <label for="mango">Mango</label>
        <input type="radio" name="fruit" id="banana" value="banana">
        <label for="banana">Banana</label>
        <br>
        <br>
        <div>
            Choose your subjects:
        <input type="checkbox" id="math" name="subjects" value="math">
        <label for="math" > math </label>
        <input type="checkbox" id="english" name="subjects" value="english">
        <label for="english" > english </label>
        <input type="checkbox" id="science" name="subjects" value="science">
        <label for="science" > science </label>
        </div> 

        <!--select element (dropdown)-->
        <div>
            Choose your profession
            <select name="profession" id="profession">
                <option>select your option</option> <!-- ye by default aata hai likha hua. choose to niche wale se krna hai-->
                <option value="student">Student</option>
                <option value="dev">Developer</option>
                <!--agar option pre selected chahiye to selected attribute use krte hain-->
                <!-- example: <option value="dev" selected >developer</option>-->
            </select>
        </div>

        <label for="vol" >Select your volume level :</label>
        <input type="range" id="vol" min="0" max="100" name="vol">

        <label for="age" >Select your age :</label>
        <input type="range" id="age" min="0" max="100" name="age" step="10">
        <!-- step use krne se value utne hi step badhti hai. jaise yaha 10 hai to ab 10, 20, 30 aise badhegi-->
         <!-- by default agar hum chahte hai ki koi value select hoke aaye to hum value attribute ka use karenge-->
        <button>Submit</button> 
    </form>
</body>
</html>
