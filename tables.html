<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table of food menu</title>
</head>
<body>
    <table>
        <caption> Food Menu </caption> <!-- caption tag is used for giving header-->
        <tr> <!-- tr tag is used for making rows-->
            <th> Item </th> <!-- th tag is used for giving heading-->
            <th> Price </th>
        </tr>
        <tr>
            <td> Frooti </td> <!-- td tag is used for displaying data -->
            <td> 10 </td>
        </tr>
        <tr>
            <td> Samosa </td>
            <td> 15 </td>
        </tr>
        <tr>
            <td> Chips </td>
            <td> 20 </td>
        </tr>
    </table>
</body>
</html>
