<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tags</title>
</head>
<body>
    <!-- use of semantic tags -->
     <header> the silent patient
        <nav> <!-- <nav> tag is used to define the navigation links of a webpage-->
            <ul>
                <li><a href="/about.html">about book</a></li>
                <li><a href="/author.html">about author</a></li>
            </ul>
        </nav>
     </header>
     <main>this is the main content</main>
     <footer>fictional book</footer>
     <!-- there can only be one header, one main, & one footer in a webpage -->
    
</body>
</html>
